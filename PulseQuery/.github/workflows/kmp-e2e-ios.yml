name: KMP E2E iOS (Maestro)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  maestro-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build iOS App
        working-directory: ./PulseQuery
        # Build the iOS app for the simulator
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -configuration Debug -derivedDataPath build/ios_simulator

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15"
          xcrun simctl bootstatus "iPhone 15" -b
          # Find the built .app
          APP_PATH=$(find ./PulseQuery/build/ios_simulator/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          xcrun simctl install "iPhone 15" "$APP_PATH"

      - name: Run Maestro Tests on iOS Simulator
        run: |
          export PATH="$PATH":"$HOME/.maestro/bin"
          maestro test ./PulseQuery/.maestro/
