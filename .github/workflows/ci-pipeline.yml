name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  python_and_angular:
    name: Test Python and Angular
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_query_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: ./pulse-query-ng-web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Python venv setup
        run: uv venv --python 3.12 "$GITHUB_WORKSPACE"/venv

      - name: Python dependencies and package install
        run: |
          . "$GITHUB_WORKSPACE"/venv/bin/activate
          uv pip install -r "requirements.txt" -r "requirements-dev.txt"
          uv pip install .
        working-directory: pulse-query-backend

      - name: Database setup
        run: |
          . "$GITHUB_WORKSPACE"/venv/bin/activate
          cp .env.tpl .env
          export $(grep -v '^#' .env | xargs -d '\n')
          alembic upgrade head
          python3 scripts/ingest.py
        working-directory: pulse-query-backend

      - name: Python tests
        run: |
          export $(grep -v '^#' .env | xargs -d '\n')
          . "$GITHUB_WORKSPACE"/venv/bin/activate
          pytest
        working-directory: pulse-query-backend

      - name: Python doc coverage
        run: |
          . "$GITHUB_WORKSPACE"/venv/bin/activate
          interrogate src/app
        working-directory: pulse-query-backend

      - name: Angular dependencies install
        run: |
          npm install
        working-directory: pulse-query-ng-web

      - name: Angular tests
        run: npm run test -- --watch=false
        working-directory: pulse-query-ng-web

  kotlin_multiplatform:
    name: Test Kotlin Multiplatform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Run KMP Tests
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:jvmTest
        working-directory: PulseQuery

  maestro_android:
    name: Maestro E2E Android
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "gradle"

      - name: Build Android APK
        working-directory: ./PulseQuery
        run: ./gradlew :composeApp:assembleDebug

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: arm64-v8a
          force-avx2-checks: false
          profile: pixel_6
          script: |
            export PATH="$PATH":"$HOME/.maestro/bin"
            adb install ./PulseQuery/composeApp/build/outputs/apk/debug/composeApp-debug.apk
            maestro test ./PulseQuery/.maestro/

  maestro_ios:
    name: Maestro E2E iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "gradle"

      - name: Build iOS App
        working-directory: ./PulseQuery
        run: |
          ./gradlew :composeApp:iosSimulatorArm64Test
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' -configuration Debug -derivedDataPath build/ios_simulator

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Start iOS Simulator and Run Maestro
        run: |
          xcrun simctl boot "iPhone 17"
          xcrun simctl bootstatus "iPhone 17" -b
          APP_PATH=$(find ./PulseQuery/build/ios_simulator/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          xcrun simctl install "iPhone 17" "$APP_PATH"
          export PATH="$PATH":"$HOME/.maestro/bin"
          maestro test ./PulseQuery/.maestro/
