<h2 i18n mat-dialog-title>Create New Dashboard</h2>

<mat-dialog-content>
  <form [formRoot]="createForm" (submit)="submit()">
    <p i18n class="text-sm mb-4" style="color: var(--sys-text-secondary)">
      Enter a name for your new analytics workspace.
    </p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label i18n>Dashboard Name</mat-label>
      <input
        matInput
        [formField]="createForm.name"
        i18n-placeholder
        placeholder="e.g. Q3 Overview"
        data-testid="input-name"
      />
      @for (err of createForm.name().errors(); track err.kind) {
        <mat-error>{{ err.message }}</mat-error>
      }
    </mat-form-field>

    @if (error()) {
      <div role="alert" class="text-red-600 text-sm mb-2" data-testid="error-msg">
        {{ error() }}
      </div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button i18n mat-button mat-dialog-close>Cancel</button>
  <button
    mat-flat-button
    (click)="submit()"
    [disabled]="createForm().invalid() || isSubmitting()"
    data-testid="btn-submit"
  >
    @if (isSubmitting()) {
      <span i18n>Creating...</span>
    } @else {
      <span i18n>Create</span>
    }
  </button>
</mat-dialog-actions>
