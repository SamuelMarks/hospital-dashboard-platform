<h2 i18n mat-dialog-title>Create New Dashboard</h2>

<mat-dialog-content>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p i18n class="text-sm text-gray-500 mb-4">Enter a name for your new analytics workspace.</p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label i18n>Dashboard Name</mat-label>
      <input
        matInput
        formControlName="name"
        i18n-placeholder
        placeholder="e.g. Q3 Overview"
        data-testid="input-name"
      />
      @if (form.get('name')?.hasError('required')) {
        <mat-error i18n>Name is required</mat-error>
      }
      @if (form.get('name')?.hasError('minlength')) {
        <mat-error i18n>Name must be at least 3 characters</mat-error>
      }
    </mat-form-field>

    @if (error()) {
      <div class="text-red-600 text-sm mb-2" data-testid="error-msg">
        {{ error() }}
      </div>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button i18n mat-button mat-dialog-close>Cancel</button>
  <button
    i18n
    mat-flat-button
    color="primary"
    (click)="submit()"
    [disabled]="form.invalid || isSubmitting()"
    data-testid="btn-submit"
  >
    @if (isSubmitting()) {
      Creating...
    } @else {
      Create
    }
  </button>
</mat-dialog-actions>
