<div class="table-container">
  <table
    mat-table
    matSort
    [dataSource]="dataSource"
    class="mat-elevation-z0"
    i18n-aria-label
    aria-label="Data Results Table"
  >
    @for (col of finalColumns(); track col) {
      <ng-container [matColumnDef]="col">
        <th mat-header-cell *matHeaderCellDef mat-sort-header scope="col" [title]="col">
          {{ formatHeaderLabel(col) }}
        </th>
        <td mat-cell *matCellDef="let row">
          <!-- Applied heuristic styling and threshold class binding -->
          <span [class]="getCellClass(row, col)" [attr.aria-label]="getCellAriaLabel(row, col)">
            {{ getCellValue(row, col) }}
          </span>
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="finalColumns(); sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: finalColumns()"></tr>

    <tr *matNoDataRow>
      <td
        i18n
        [attr.colspan]="finalColumns().length || 1"
        class="p-6 text-center italic"
        style="color: var(--sys-text-secondary)"
      >
        No data available
      </td>
    </tr>
  </table>
</div>

<mat-paginator
  #paginator
  [pageSize]="10"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
  class="border-t"
  [style.display]="showPaginator() ? 'block' : 'none'"
  i18n-aria-label
  aria-label="Table Paginator"
></mat-paginator>
