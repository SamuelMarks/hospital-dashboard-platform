<div class="card">
  <div class="header">
    <span i18n>Suggested Query</span>
    <div class="flex gap-2 items-center">
      <!-- Copy -->
      <button
        type="button"
        mat-icon-button
        class="text-gray-300 hover:text-white"
        (click)="copy()"
        i18n-aria-label
        aria-label="Copy SQL"
        i18n-matTooltip
        matTooltip="Copy to Clipboard"
      >
        <mat-icon aria-hidden="true" style="font-size: 16px">content_copy</mat-icon>
      </button>

      <!-- Cart Action -->
      <button
        type="button"
        mat-icon-button
        class="text-gray-300 hover:text-white"
        (click)="emitAddToCart()"
        i18n-aria-label
        aria-label="Save to Cart"
        i18n-matTooltip
        matTooltip="Save to Query Cart"
        data-testid="btn-cart"
      >
        <mat-icon aria-hidden="true" style="font-size: 16px">shopping_cart</mat-icon>
      </button>

      <button
        type="button"
        mat-icon-button
        class="text-gray-300 hover:text-white"
        (click)="emitSimulate()"
        i18n-aria-label
        aria-label="Simulate Scenario"
        i18n-matTooltip
        matTooltip="Simulate Scenario"
      >
        <mat-icon aria-hidden="true" style="font-size: 16px">science</mat-icon>
      </button>

      <button
        i18n
        type="button"
        mat-stroked-button
        class="text-xs px-2"
        style="color: #e2e8f0; border-color: #9da5b4"
        (click)="emitRun()"
        [disabled]="!sql()"
      >
        <mat-icon
          aria-hidden="true"
          class="mr-1 text-xs"
          style="font-size: 14px; width: 14px; height: 14px"
          >play_arrow</mat-icon
        >
        Run
      </button>
    </div>
  </div>
  <div class="code-block" [innerHTML]="highlightedSql()"></div>
</div>
