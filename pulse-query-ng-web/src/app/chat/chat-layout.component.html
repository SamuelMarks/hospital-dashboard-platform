<mat-sidenav-container class="sidenav-container">
  <!-- Side Drawer (Collapsible) -->
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="isHandset() ? false : sidebarOpen()"
    class="history-drawer"
  >
    <!-- Use Tabs to switch between History and Cart -->
    <mat-tab-group class="sidebar-tabs" animationDuration="0ms">
      <!-- TAB 1: HISTORY -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon aria-hidden="true" class="mr-2 icon-sm">history</mat-icon>
          <span i18n>History</span>
        </ng-template>

        <div class="tab-column">
          <div class="history-header">
            <button mat-stroked-button class="w-full" (click)="newChat()">
              <mat-icon aria-hidden="true">add</mat-icon>
              <span i18n>New Chat</span>
            </button>
          </div>

          @if (store.isDataLoading()) {
            <div class="flex justify-center p-8"><mat-spinner diameter="32"></mat-spinner></div>
          }

          <div class="history-list" role="list">
            @for (group of groupedHistory(); track group.label) {
              <div class="group-label" role="listitem">{{ group.label }}</div>
              @for (chat of group.items; track chat.id) {
                <div
                  class="nav-item-container"
                  role="listitem"
                  [class.active]="store.activeConversationId() === chat.id"
                >
                  <button
                    type="button"
                    class="nav-content"
                    [attr.aria-current]="store.activeConversationId() === chat.id ? 'page' : null"
                    (click)="selectChat(chat.id)"
                  >
                    <mat-icon aria-hidden="true" class="mr-2 text-sm">chat_bubble_outline</mat-icon>
                    <span class="truncate text-sm">{{ chat.title }}</span>
                  </button>

                  <!-- Context Menu Button -->
                  <button
                    mat-icon-button
                    [attr.aria-label]="getOptionsAriaLabel(chat)"
                    class="action-btn scale-75"
                    [matMenuTriggerFor]="menu"
                    (click)="$event.stopPropagation()"
                  >
                    <mat-icon aria-hidden="true">more_vert</mat-icon>
                  </button>

                  <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="renameChat(chat)">
                      <mat-icon aria-hidden="true">edit</mat-icon>
                      <span i18n>Rename</span>
                    </button>
                    <button mat-menu-item (click)="deleteChat(chat)" class="text-red-600">
                      <mat-icon aria-hidden="true">delete</mat-icon>
                      <span i18n>Delete</span>
                    </button>
                  </mat-menu>
                </div>
              }
            }
          </div>
        </div>
      </mat-tab>

      <!-- TAB 2: QUERY CART -->
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon aria-hidden="true" class="mr-2 icon-sm">shopping_cart</mat-icon>
          <span i18n>Cart</span>
          @if (cart.count() > 0) {
            <span class="badgex">{{ cart.count() }}</span>
          }
        </ng-template>

        <div class="tab-column overflow-y-auto">
          <!-- Reuse the Query Cart Component -->
          <app-query-cart></app-query-cart>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-sidenav>

  <mat-sidenav-content class="chat-main relative flex flex-col h-full overflow-hidden">
    @if (isHandset()) {
      <mat-toolbar class="flex-none">
        <button
          mat-icon-button
          i18n-aria-label
          aria-label="Toggle conversation history sidebar"
          [attr.aria-expanded]="drawer.opened"
          (click)="drawer.toggle()"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
        <span i18n>Assistant</span>
      </mat-toolbar>
    }

    <!-- Desktop Toggle Button -->
    @if (!isHandset()) {
      <button
        mat-icon-button
        i18n-aria-label
        aria-label="Toggle conversation history sidebar"
        [attr.aria-expanded]="sidebarOpen()"
        class="absolute left-2 top-2 z-10 bg-surface shadow-sm border border-border opacity-50 hover:opacity-100 transition-opacity"
        (click)="toggleSidebar()"
        i18n-matTooltip
        matTooltip="Toggle Sidebar"
        style="background: var(--sys-surface); border-color: var(--sys-surface-border)"
      >
        <mat-icon aria-hidden="true">{{
          sidebarOpen() ? 'chevron_left' : 'chevron_right'
        }}</mat-icon>
      </button>
    }

    <div class="flex-grow min-h-0 h-full flex flex-col pt-0">
      <app-conversation class="flex-grow min-h-0"></app-conversation>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
