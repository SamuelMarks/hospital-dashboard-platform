<!-- MatToolbar acts as the surface container -->
<mat-toolbar class="filter-toolbar">
  <!-- Label Section -->
  <div class="filter-label">
    <mat-icon i18n class="text-secondary icon-small">filter_list</mat-icon>
    <span i18n class="label-text">Data Filters</span>
  </div>

  <form [formRoot]="ribbonForm" class="filter-group">
    <!-- 1. Department -->
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      density="compact"
      class="ribbon-field"
    >
      <mat-label i18n>Department</mat-label>
      <mat-select
        [formField]="ribbonForm.dept"
        (selectionChange)="onDeptChange($event.value)"
        i18n-placeholder
        placeholder="All Departments"
        i18n-aria-label
        aria-label="All Departments"
      >
        <mat-option i18n [value]="null">All Departments</mat-option>
        <mat-option i18n value="Cardiology">Cardiology</mat-option>
        <mat-option i18n value="Neurology">Neurology</mat-option>
        <mat-option i18n value="Orthopedics">Orthopedics</mat-option>
        <mat-option i18n value="Emergency">Emergency</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- 2. Date Range -->
    <mat-form-field
      appearance="outline"
      subscriptSizing="dynamic"
      density="compact"
      class="date-field"
    >
      <mat-label i18n>Reporting Period</mat-label>
      <mat-date-range-input [rangePicker]="picker" separator=" – ">
        <input
          matStartDate
          i18n-placeholder
          placeholder="Start"
          [formField]="ribbonForm.startDate"
          (dateChange)="onDateChange()"
          i18n-aria-label
          aria-label="Start Date"
        />
        <input
          matEndDate
          i18n-placeholder
          placeholder="End"
          [formField]="ribbonForm.endDate"
          (dateChange)="onDateChange()"
          i18n-aria-label
          aria-label="End Date"
        />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>

    <!-- 3. Clear Action -->
    @if (store.globalParams()['dept'] || store.globalParams()['start_date']) {
      <button
        i18n
        mat-button
        color="warn"
        type="button"
        (click)="clearFilters()"
        i18n-aria-label
        aria-label="Clear all filters"
      >
        <mat-icon>highlight_off</mat-icon> Clear
      </button>
    }
  </form>
</mat-toolbar>
