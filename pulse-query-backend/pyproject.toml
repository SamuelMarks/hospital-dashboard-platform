[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "app"
version = "0.0.1"
description = "Backend for the dashboard platform focussing on hospital resource allocation (esp. bed allocation)"
authors = [{ name = "Samuel Marks", email = "807580+SamuelMarks@users.noreply.github.com" }]
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]

[dependency-groups]
dev = [
    "anyio",
    "interrogate>=1.7.0",
    "mypy>=1.8.0",
    "pytest-asyncio>=0.23.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.22.0",
    "pre-commit>=3.5.0",
    "ruff>=0.16.0",
    "sqlalchemy[mypy]>=2.0.25",
]


[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]
line-length = 122
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B904", "N818", "D", "D105", "D107", "D417", "ANN", "ASYNC", "PT", "RET", "SIM", "C90", "ERA"]
ignore = ["E741", "E701", "UP035", "BLE001", "EXE001", "DTZ005", "S110", "TRY401", "PLW1510", "C414", "G201", "TRY002", "B008", "TRY201", "PLC0414", "D200", "D205", "D212", "D415"]
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["asyncio: mark test as async"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100"
filterwarnings = [
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
    "ignore:Unknown config option:pytest.PytestConfigWarning",
]

[tool.coverage.run]
branch = true
source = ["app", "scripts"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    '^\s*\.\.\.$',
]

[tool.interrogate]
fail-under = 100.0
ignore-init-method = false
ignore-init-module = false
ignore-private = false
ignore-magic = false
ignore-nested-functions = false
exclude = []

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = ["src", "."]
strict = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "jose",
    "jose.*",
    "passlib",
    "passlib.*",
    "mpax",
    "mpax.*",
    "jax",
    "jax.*",
    "sqlglot",
    "sqlglot.*",
    "any_llm",
    "any_llm.*",
    "respx",
    "respx.*",
    "duckdb",
    "duckdb.*",
    "aiosqlite",
    "aiosqlite.*",
]
ignore_missing_imports = true
follow_imports = "silent"
